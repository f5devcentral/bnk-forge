{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bnk-operator.fullname" . }}
  labels:
    {{- include "bnk-operator.labels" . | nindent 4 }}
rules:
  # F5 BNK data-plane CRDs (k8s.f5net.com)
  - apiGroups: ["k8s.f5net.com"]
    resources: ["*"]
    verbs: ["*"]
  # F5 BNK FLO-managed CRDs (k8s.f5.com)
  - apiGroups: ["k8s.f5.com"]
    resources: ["*"]
    verbs: ["*"]
  # F5 BNK gateway extensions (gateway.k8s.f5net.com)
  - apiGroups: ["gateway.k8s.f5net.com"]
    resources: ["*"]
    verbs: ["*"]
  # F5 IPAM (fic.f5.com)
  - apiGroups: ["fic.f5.com"]
    resources: ["*"]
    verbs: ["*"]
  # Gateway API
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "gatewayclasses", "httproutes", "grpcroutes", "referencegrants"]
    verbs: ["*"]
  # Core resources
  - apiGroups: [""]
    resources: ["namespaces", "secrets", "configmaps", "services", "pods", "pods/log", "events", "nodes", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Workloads
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Batch
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # cert-manager
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "issuers", "clusterissuers", "certificaterequests"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  # Storage
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  # Multus CNI
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["network-attachment-definitions"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  # CRDs (for scanning and cleanup)
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch", "delete"]
  # RBAC (read-only, for scanning)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
{{- end }}
