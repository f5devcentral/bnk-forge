# NOTE: All services use network_mode: host, so proxy_pass targets are
# localhost:<port> instead of Docker container names. No DNS resolver needed.

# SEC-005: Rate limiting zones
# Login endpoint — strict limit (5 req/min per IP to prevent brute-force)
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
# General API — moderate limit (30 req/s per IP)
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# HTTP → HTTPS redirect (when TLS is enabled)
# Port 8082 (not 8080) — the frontend container already owns host port 8080
# under network_mode: host (see frontend-v2/nginx.conf), so this listener
# must use a different port to avoid an EADDRINUSE bind collision.
server {
    listen 8082;
    server_name _;

    # If TLS certs exist, redirect all HTTP traffic to HTTPS.
    # If no certs, this block is the only server and serves traffic directly.
    # To disable TLS: remove/rename /etc/nginx/ssl/server.crt
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name _;

    # TLS configuration — self-signed cert generated at container startup
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS — tell browsers to always use HTTPS (1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # SEC-005: Hide nginx version in error pages and headers
    server_tokens off;

    # SEC-005: Security headers — applied to all responses
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # SEC-006: Content Security Policy — mitigates XSS, injection, and data exfiltration
    # 'self' = same origin only, 'unsafe-inline' needed for styled-components / Tailwind
    # 'unsafe-eval' needed for some JS bundler patterns; tighten with nonces in future
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: ws:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # SEC-005: Gzip compression — reduces transfer size for API responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Increase client max body size for large file uploads
    client_max_body_size 100M;

    # ROI Tool reverse proxy (runs on separate ports on the host)
    location /roi/api/ {
        rewrite ^/roi(/api/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3030;
        proxy_set_header Host $host;
    }

    location /roi/ {
        rewrite ^/roi(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3031;
        proxy_set_header Host $host;
    }

    location = /roi {
        return 301 /roi/;
    }

    # MCP Server — AI-accessible tools via Streamable HTTP (port 8081)
    # Clients connect to: https://<host>/mcp
    # Supports POST (tool calls) and GET (SSE streams) per MCP spec
    location = /mcp {
        proxy_pass http://127.0.0.1:8081/mcp;
        proxy_http_version 1.1;

        # SSE support (MCP Streamable HTTP may use Server-Sent Events)
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for long-running tool calls
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Disable buffering for SSE streaming
        proxy_buffering off;
        proxy_cache off;

        # Pass through MCP headers
        proxy_pass_header Mcp-Session-Id;
        proxy_pass_header MCP-Protocol-Version;
    }

    # Frontend SPA at root (port 8080 — host networking, no Docker DNS)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SEC-005: Strict rate limit on login endpoint (brute-force protection)
    location = /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API proxy (REST endpoints)
    location /api/ {
        # SEC-005: General API rate limiting (burst allows short spikes)
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket support (for notifications etc)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running operations (terraform apply can take minutes)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Disable buffering for real-time streaming
        proxy_buffering off;
    }

    # WebSocket proxy for K8s exec terminal and log streaming
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket upgrade headers (required)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for long-running terminal sessions
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Disable buffering for real-time terminal I/O
        proxy_buffering off;
    }
}
