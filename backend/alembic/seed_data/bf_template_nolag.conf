#==============================================================================
#  bf.conf — NON-LAG TEMPLATE  (rendered from bf_template_nolag.conf)
#
#  Each physical uplink (p0, p1) sits on its own OVS bridge:
#     p0 → sf-external   (untagged VLAN id 0, iface name external0)
#     p1 → sf-internal   (untagged VLAN id 0, iface name internal0)
#  No bonding, no LAG. Use bf_template_lag.conf if you need 802.3ad LAG.
#  "Router-on-a-stick" / extra VLANs are NOT supported in this mode —
#  the project's settings UI rejects extras when this template is
#  selected.
#==============================================================================

# UPDATE_DPU_OS - Update/Install BlueField Operating System (Default: yes)
UPDATE_DPU_OS="yes"
# openssl passwd -1 "<clear_password>"
# ubuntu_PASSWORD=''
ubuntu_PASSWORD='{{ DPU_UBUNTU_PASSWORD_HASH }}'
MTU={{ dpu_mtu }}

bfb_modify_os()
{
    # Set hostname
    local hname="{{ bfb_hostname }}"
    echo ${hname} > /mnt/etc/hostname
    echo "127.0.0.1 ${hname}" >> /mnt/etc/hosts

    cat << EOFNET > /mnt/etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
network: {config: disabled}
EOFNET

    # Configure mgmt
    cat << EOFMGMT > /mnt/etc/netplan/50-mgmt.yaml
network:
  renderer: networkd
  ethernets:
    tmfifo_net0:
      dhcp4: false
      addresses:
        - {{ hostvars[bfb_hostname].tmfifo_dpu_ip }}
    oob_net0:
      dhcp4: true
      dhcp6: true
  version: 2
EOFMGMT
    chmod 600 /mnt/etc/netplan/50-mgmt.yaml

    cat << EOFRESOLVE > /mnt/etc/systemd/resolved.conf
[Resolve]
DNS={{ hostvars[bfb_hostname].dns_ip }}
Domains={{ hostvars[bfb_hostname].dns_domains }}
FallbackDNS=
DNSStubListener=yes
EOFRESOLVE

    cat << EOFTIMESYNC > /mnt/etc/systemd/timesyncd.conf
[Time]
NTP={{ hostvars[bfb_hostname].ntp_servers }}
EOFTIMESYNC

    # Modules for kubernetes and DPDK. mst_pci is added so `mst start`
    # survives a reboot — without persistent loading it would only be
    # available on the first boot when bfb_post_install runs. The OVS
    # bridges reference SF representors (en3f0pf0sf1, en3f1pf1sf1)
    # which require mst tooling at runtime.
    cat << EOFMODULES >> /mnt/etc/modules-load.d/custom.conf
overlay
br_netfilter
vfio_pci
mst_pci
EOFMODULES

    # sysctl settings for kubernetes
    cat << EOFSYSCTL >> /mnt/etc/sysctl.d/kubernetes.conf
net.bridge.bridge-nf-call-ip6tables = 1
net.bridge.bridge-nf-call-iptables = 1
net.ipv4.ip_forward = 1
EOFSYSCTL

    # Hugepages on the kernel cmdline — identical to LAG variant.
    local grub_cmd="console=hvc0 console=ttyAMA0 earlycon=pl011,0x13010000 fixrttc net.ifnames=0 biosdevname=0 iommu.passthrough=1 cgroup_no_v1=net_prio,net_cls default_hugepagesz=2MB hugepagesz=2M hugepages=8192"
    sed -i -E "s|^(GRUB_CMDLINE_LINUX=\")(.*)\"|\1${grub_cmd}\"|" /mnt/etc/default/grub
    ilog "$(chroot /mnt env PATH=$PATH /usr/sbin/grub-mkconfig -o /boot/grub/grub.cfg)"

    # Provision one SF per PF (sfnum=1) — matches F5's BNK CNE recipe.
    # The OVS bridges below reference en3f0pf0sf1 / en3f1pf1sf1 (the
    # sfnum=1 representors), so creating fewer SFs here would leave
    # those ports unattachable.
    rm -f /mnt/etc/mellanox/mlnx-sf.conf
    for pciid in $(lspci -nD 2> /dev/null | grep 15b3:a2d[26c] | awk '{print $1}')
        do
            cat << EOFSF >> /mnt/etc/mellanox/mlnx-sf.conf
/sbin/mlnx-sf --action create --device $pciid --sfnum 1 --enable-trust --hwaddr $(uuidgen | sed -e 's/-//;s/^\(..\)\(..\)\(..\)\(..\)\(..\).*$/02:\1:\2:\3:\4:\5/')
EOFSF
        done

    # Two OVS bridges, one per uplink — VLAN interfaces hang off the
    # bridge that owns their configured uplink (p0 → sf-external,
    # p1 → sf-internal). LAG_HASH_MODE is intentionally omitted from
    # /etc/mellanox/mlnx-bf.conf for the non-LAG path; if a previous
    # boot wrote it, scrub it so a stale value can't bring LAG back.
    cat <<EOFOVS > /mnt/etc/mellanox/mlnx-ovs.conf
CREATE_OVS_BRIDGES="yes"
OVS_BRIDGE1="sf-external"
OVS_BRIDGE1_PORTS="p0 pf0hpf en3f0pf0sf1"
OVS_BRIDGE2="sf-internal"
OVS_BRIDGE2_PORTS="p1 pf1hpf en3f1pf1sf1"
OVS_HW_OFFLOAD="yes"
EOFOVS

    if [ -f /mnt/etc/mellanox/mlnx-bf.conf ]; then
        sed -i '/^LAG_HASH_MODE=/d' /mnt/etc/mellanox/mlnx-bf.conf
    fi

    # Boot-time guarantee that the Scalable Functions listed in mlnx-sf.conf
    # exist on the auxiliary bus. NVIDIA's `mlnx_bf_configure` (triggered by
    # the `install ib_umad` modprobe hook in /etc/modprobe.d/mlnx-bf.conf)
    # also sources mlnx-sf.conf, but that hook fires on direct `modprobe
    # ib_umad` only — and field experience shows SFs sometimes disappear
    # between boots even when the hook runs. This unit is the safety net.
    # ConditionPathExistsGlob skips it when SFs are already present, so it
    # coexists with mlnx_bf_configure without double-creating (mlnx-sf is
    # NOT idempotent — second invocation returns "SF already exist", exit 1).
    cat << 'EOFUNIT' > /mnt/etc/systemd/system/mlnx-sf-create.service
[Unit]
Description=Create BlueField Scalable Functions from /etc/mellanox/mlnx-sf.conf
After=mst.service
After=systemd-modules-load.service
Before=openvswitch-switch.service
Before=ovs-vlan-init.service
Before=kubelet.service
ConditionPathExists=/etc/mellanox/mlnx-sf.conf
ConditionPathExistsGlob=!/sys/bus/auxiliary/devices/mlx5_core.sf.*

[Service]
Type=oneshot
ExecStart=/bin/bash /etc/mellanox/mlnx-sf.conf
RemainAfterExit=yes
StandardOutput=journal
StandardError=journal

[Install]
WantedBy=multi-user.target
EOFUNIT
    mkdir -p /mnt/etc/systemd/system/multi-user.target.wants
    ln -sf /etc/systemd/system/mlnx-sf-create.service \
        /mnt/etc/systemd/system/multi-user.target.wants/mlnx-sf-create.service

    # Physical uplinks only — no bonds. VLAN interfaces are created by
    # the OVS init service below as internal ports on the right bridge.
    cat << EOFNETPLAN > /mnt/etc/netplan/70-bf-nolag.yaml
network:
  renderer: networkd
  ethernets:
    p0:
      mtu: "$MTU"
      dhcp4: no
      optional: true
    p1:
      mtu: "$MTU"
      dhcp4: no
      optional: true
  version: 2
EOFNETPLAN
    chmod 600 /mnt/etc/netplan/70-bf-nolag.yaml

# --- Persist OVS VLAN config via systemd oneshot ---
cat > /mnt/usr/local/sbin/ovs-vlan-init.sh <<'EOS'
#!/usr/bin/env bash
set -euo pipefail

# Wait for OVS DB socket to be ready
for i in $(seq 1 60); do
  ovs-vsctl --timeout=2 show >/dev/null 2>&1 && break
  sleep 1
done

{% for vlan in hostvars[bfb_hostname].vlans %}

# vlan {{ loop.index0 }} — uplink {{ vlan.uplink }}
{% if vlan.uplink == "p0" %}
{% set bridge = "sf-external" %}
{% elif vlan.uplink == "p1" %}
{% set bridge = "sf-internal" %}
{% else %}
{% set bridge = "sf-external" %}
{% endif %}
ovs-vsctl --may-exist add-port {{ bridge }} {{ vlan.name }} -- set interface {{ vlan.name }} type=internal
ovs-vsctl set port {{ vlan.name }} tag={{ vlan.tag }}
ip link set {{ vlan.name }} up
ip addr replace {{ vlan.ip }} dev {{ vlan.name }}
{% if vlan.default_gateway is defined %}
ip route replace default via {{ vlan.default_gateway }} dev {{ vlan.name }}
{% endif %}
{% endfor %}

EOS

chmod 755 /mnt/usr/local/sbin/ovs-vlan-init.sh

cat > /mnt/etc/systemd/system/ovs-vlan-init.service <<'EOS'
[Unit]
Description=Configure OVS VLAN trunks and internal VLAN interfaces
After=openvswitch-switch.service
Wants=openvswitch-switch.service
StartLimitInterval=0

[Service]
Type=oneshot
ExecStart=/usr/local/sbin/ovs-vlan-init.sh
RemainAfterExit=yes
Restart=on-failure
RestartSec=2

[Install]
WantedBy=multi-user.target
EOS

# Enable in the target OS
mkdir -p /mnt/etc/systemd/system/multi-user.target.wants
ln -sf /etc/systemd/system/ovs-vlan-init.service \
  /mnt/etc/systemd/system/multi-user.target.wants/ovs-vlan-init.service

    # Mask dnsmasq in the target OS
    ln -sf /dev/null /mnt/etc/systemd/system/dnsmasq.service

# Auto-upgrade NIC firmware on every boot. NVIDIA's openibd.service
# reads RUN_FW_UPDATER_ONBOOT from /etc/infiniband/openib.conf and
# runs mlnx_fw_updater.pl when it's "yes" (upgrade-only by default —
# downgrades require manual --force-fw-update). The BFB installer on
# BSP 2.9.x doesn't run a NIC FW pass during install; this flips the
# already-shipped on-boot path on instead.
echo 'RUN_FW_UPDATER_ONBOOT=yes' >> /mnt/etc/infiniband/openib.conf

    # Cloud-init for deleting standalone kubelet
    cat << EOFCLOUDINIT >> /mnt/var/lib/cloud/seed/nocloud-net/user-data
write_files:
  - path: /var/tmp/setup-script.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      systemctl stop containerd kubelet kubepods.slice
      rm -rf /var/lib/containerd/*
      rm -rf /run/containerd/*
      rm -f /usr/lib/systemd/system/kubelet.service.d/90-kubelet-bluefield.conf
      systemctl daemon-reload
runcmd:
  - [ /var/tmp/setup-script.sh ]
EOFCLOUDINIT
}

# bfb_post_install - SHELL function called as a last step before reboot.
# Single-line mlxconfig matches the LAG template's structure, with the
# non-LAG-specific flags (HIDE_PORT2_PF=False, NUM_OF_PF=2,
# LAG_RESOURCE_ALLOCATION=DEVICE_DEFAULT) folded in.
bfb_post_install()
{
    log ===================== bfb_post_install =====================
    mst start
    mst_device=$(/bin/ls /dev/mst/mt*pciconf0 2> /dev/null)
    log "Setting SF enable, BAR size, and non-LAG mode for $mst_device"
    for mst_device in /dev/mst/mt*pciconf*
    do
      mlxconfig -y -d $mst_device s PF_BAR2_ENABLE=0 PER_PF_NUM_SF=1 PF_TOTAL_SF=20 PF_SF_BAR_SIZE=10 NUM_OF_VFS=46 HIDE_PORT2_PF=False NUM_OF_PF=2 LAG_RESOURCE_ALLOCATION=DEVICE_DEFAULT INTERNAL_CPU_OFFLOAD_ENGINE=0 INTERNAL_CPU_MODEL=1
      mlxprivhost -d $mst_device p  # disable Zero-Trust Mode
    done
}
