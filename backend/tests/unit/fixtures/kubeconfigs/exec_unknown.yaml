apiVersion: v1
kind: Config
current-context: oidc-cluster
clusters:
- name: oidc-cluster
  cluster:
    certificate-authority-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCmZha2VjYQo=
    server: https://oidc-cluster:6443
contexts:
- name: oidc-cluster
  context:
    cluster: oidc-cluster
    user: oidc-user
users:
- name: oidc-user
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      command: unknown-auth-plugin
      args:
      - get-token
      - --oidc-issuer-url
      - https://dex.example.com
