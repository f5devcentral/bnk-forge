{{- if .Values.mcp.enabled -}}
{{- $name := printf "%s-mcp" (include "bnk-forge.fullname" .) -}}
{{- $apiSvc := printf "%s-api" (include "bnk-forge.fullname" .) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "bnk-forge.componentLabels" (list . "mcp") | nindent 4 }}
spec:
  type: {{ .Values.mcp.service.type }}
  selector:
    {{- include "bnk-forge.componentLabels" (list . "mcp") | nindent 4 }}
  ports:
    - port: {{ .Values.mcp.service.port }}
      targetPort: 8081
      name: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "bnk-forge.componentLabels" (list . "mcp") | nindent 4 }}
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      {{- include "bnk-forge.componentLabels" (list . "mcp") | nindent 6 }}
  template:
    metadata:
      annotations:
        # #187: roll the pod when the Secret changes, so the backend (which
        # re-seeds the mcp account) and the MCP server (which authenticates with
        # it) pick up a rotated mcp-password together instead of drifting for a
        # restart cycle.
        checksum/secret: {{ include "bnk-forge.secretsChecksum" . }}
      labels:
        {{- include "bnk-forge.componentLabels" (list . "mcp") | nindent 8 }}
    spec:
      {{- include "bnk-forge.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: mcp
          image: {{ include "bnk-forge.image" (list . .Values.mcp.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: BNK_FORGE_API_URL
              value: "http://{{ $apiSvc }}:{{ .Values.api.service.port }}"
            - name: BNK_FORGE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "bnk-forge.fullname" . }}-secrets
                  key: mcp-username
            - name: BNK_FORGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bnk-forge.fullname" . }}-secrets
                  key: mcp-password
            - name: MCP_PORT
              value: "8081"
            - name: MCP_LOG_LEVEL
              value: INFO
          ports:
            - containerPort: 8081
              name: mcp
          # bonnyr-f5 #193 M7: exec the same auth-probe healthcheck the compose
          # paths run (`python -m bnk_forge_mcp.healthcheck`) instead of a bare
          # tcpSocket. A tcpSocket probe only proves the port is open; it cannot
          # detect the "no usable MCP credentials -> 401 on every backend call"
          # condition (M8: a disabled mcp row). The auth probe logs in to the
          # backend and exits non-zero on 401, so a credential drift surfaces as
          # UNHEALTHY on Kubernetes too, not just on the compose/dist paths.
          readinessProbe:
            exec:
              command: ["python", "-m", "bnk_forge_mcp.healthcheck"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["python", "-m", "bnk_forge_mcp.healthcheck"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
{{- end }}
