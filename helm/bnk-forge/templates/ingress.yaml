{{- if .Values.ingress.enabled -}}
{{- $proxySvc := printf "%s-proxy" (include "bnk-forge.fullname" .) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bnk-forge.fullname" . }}
  labels:
    {{- include "bnk-forge.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.secretName }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $proxySvc }}
                port:
                  number: {{ if .Values.ingress.tls.enabled }}{{ .Values.proxy.service.httpsPort }}{{ else }}{{ .Values.proxy.service.httpPort }}{{ end }}
{{- end }}
