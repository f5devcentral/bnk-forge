{{/* Re-use existing secret values across upgrades. */}}
{{- $name := printf "%s-secrets" (include "bnk-forge.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $pgPass := .Values.secrets.postgresPassword -}}
{{- if and (not $pgPass) $existing -}}
{{- $pgPass = (index $existing.data "postgres-password" | b64dec) -}}
{{- end -}}
{{- if not $pgPass -}}{{- $pgPass = randAlphaNum 24 -}}{{- end -}}

{{- $rdPass := .Values.secrets.redisPassword -}}
{{- if and (not $rdPass) $existing -}}
{{- $rdPass = (index $existing.data "redis-password" | b64dec) -}}
{{- end -}}
{{- if not $rdPass -}}{{- $rdPass = randAlphaNum 24 -}}{{- end -}}

{{- $jwt := .Values.secrets.jwtSecretKey -}}
{{- if and (not $jwt) $existing -}}
{{- $jwt = (index $existing.data "jwt-secret-key" | b64dec) -}}
{{- end -}}
{{- if not $jwt -}}{{- $jwt = randAlphaNum 64 -}}{{- end -}}

{{- $enc := .Values.secrets.encryptionKey -}}
{{- if and (not $enc) $existing -}}
{{- $enc = (index $existing.data "encryption-key" | b64dec) -}}
{{- end -}}
{{- if not $enc -}}{{- $enc = randAlphaNum 32 -}}{{- end -}}

{{/* #187: the published default was "changeme"; every existing install carries it
     in its Secret and would keep it forever on upgrade (the mcp account is
     role=admin, must_change_password=False, so #186's gate never rotates it). Rotate
     ONLY the value carried in the persisted Secret — never a value the operator
     supplied via values.yaml. bonnyr-f5 #188 round 4: rotating on the values-supplied
     "changeme" fired on EVERY render (randAlphaNum is not idempotent), so an operator
     whose values file carried "changeme" got a new password + checksum each sync ->
     perpetual GitOps drift and rolling pods. Scoping the rotate to $existing.data
     converges after one render: the next lookup finds the rotated value and reuses it. */}}
{{- $mcpPass := .Values.secrets.mcpPassword -}}
{{- if and (not $mcpPass) $existing -}}
{{- $mcpFromSecret := (index $existing.data "mcp-password" | b64dec) -}}
{{- if eq $mcpFromSecret "changeme" -}}
{{- $mcpPass = randAlphaNum 24 -}}
{{- else -}}
{{- $mcpPass = $mcpFromSecret -}}
{{- end -}}
{{- end -}}
{{- if not $mcpPass -}}{{- $mcpPass = randAlphaNum 24 -}}{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "bnk-forge.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ $pgPass | quote }}
  redis-password: {{ $rdPass | quote }}
  jwt-secret-key: {{ $jwt | quote }}
  encryption-key: {{ $enc | quote }}
  mcp-username: {{ .Values.secrets.mcpUsername | quote }}
  mcp-password: {{ $mcpPass | quote }}
