{{- if .Values.api.enabled -}}
{{- $name := printf "%s-api" (include "bnk-forge.fullname" .) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "bnk-forge.componentLabels" (list . "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "bnk-forge.componentLabels" (list . "api") | nindent 4 }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: 8000
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "bnk-forge.componentLabels" (list . "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "bnk-forge.componentLabels" (list . "api") | nindent 6 }}
  template:
    metadata:
      annotations:
        # #187: roll the pod when the Secret changes, so the backend (which
        # re-seeds the mcp account) and the MCP server (which authenticates with
        # it) pick up a rotated mcp-password together instead of drifting for a
        # restart cycle.
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      labels:
        {{- include "bnk-forge.componentLabels" (list . "api") | nindent 8 }}
    spec:
      {{- include "bnk-forge.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "bnk-forge.image" (list . .Values.api.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "bnk-forge.backendEnv" . | nindent 12 }}
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /api/system/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/system/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            {{- include "bnk-forge.sharedVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "bnk-forge.sharedVolumes" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
