{{- if .Values.frontend.enabled -}}
{{- $name := printf "%s-frontend" (include "bnk-forge.fullname" .) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "bnk-forge.componentLabels" (list . "frontend") | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "bnk-forge.componentLabels" (list . "frontend") | nindent 4 }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 8080
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "bnk-forge.componentLabels" (list . "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "bnk-forge.componentLabels" (list . "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bnk-forge.componentLabels" (list . "frontend") | nindent 8 }}
    spec:
      {{- include "bnk-forge.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: frontend
          image: {{ include "bnk-forge.image" (list . .Values.frontend.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 30
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
{{- end }}
