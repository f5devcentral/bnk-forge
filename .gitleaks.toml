# gitleaks configuration for the public BNK Forge repository.
#
# Every entry below is a reviewed false positive with a stated reason. Do NOT
# add blanket directory allowlists — that is how a real credential hides. Scope
# each entry to a rule + a specific path.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\|:|<=|=>|:|\?=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|\\]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

[rules.allowlist]
paths = [
  # Fixture credentials asserted on by name; values are literals like "fake",
  # "test-token", "changeme". Verified 2026-08: no production credential.
  '''backend/tests/.*\.py''',
  '''bnk-operator/tests/.*\.py''',
  '''frontend-v2/src/.*__tests__/.*\.tsx?''',
  # Documentation examples using obviously-illustrative token shapes.
  '''cli/README\.md''',
  '''docs/archive/OPERATOR_ARCHITECTURE\.md''',
]

[allowlist]
description = "Reviewed non-secrets"
regexes = [
  # AWS's own published documentation example key.
  '''AKIAIOSFODNN7EXAMPLE''',
  # Structural JWT test vector — the signature segment is the literal
  # "signature_here"; used to test _looks_like_jwt().
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiJ0ZXN0In0\.signature_here''',
  # Synthetic Azure SSO mock refresh token in component tests
  '''M\.R3_BAY\.-CgJ0ZXN0LXJlZnJlc2gtdG9rZW4''',
  # Microsoft's publicly documented Azure CLI client ID (04b07795-8ddb-461a-bbee-02f9e1bf7b46)
  '''04b07795-8ddb-461a-bbee-02f9e1bf7b46''',
]

[[rules]]
id = "private-key"
# bonnyr-f5 #182: scope the fixture private keys to the private-key rule only, so
# a real AWS/GitHub/generic secret hidden in these same files is still caught --
# a top-level [allowlist].paths would have disabled EVERY rule for them. The
# .pyc/__pycache__ blanket entries were dropped (zero tracked files).
[rules.allowlist]
paths = [
  '''backend/tests/unit/test_paramiko_utils\.py''',
  '''backend/tests/component/test_agent_host_candidates\.py''',
  '''backend/tests/integration/test_routes_project_secrets\.py''',
  '''backend/tests/unit/test_infrastructure_access_service\.py''',
]
