# gitleaks configuration for the public BNK Forge repository.
#
# Every entry below is a reviewed false positive with a stated reason. Do NOT
# add blanket directory allowlists — that is how a real credential hides. Scope
# each entry to a rule + a specific path.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\|:|<=|=>|:|\?=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|\\]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

[rules.allowlist]
paths = [
  # Fixture credentials asserted on by name; values are literals like "fake",
  # "test-token", "changeme". Verified 2026-08: no production credential.
  '''backend/tests/.*\.py''',
  '''bnk-operator/tests/.*\.py''',
  '''frontend-v2/src/.*__tests__/.*\.tsx?''',
  # Documentation examples using obviously-illustrative token shapes.
  '''cli/README\.md''',
  '''docs/archive/OPERATOR_ARCHITECTURE\.md''',
]

[allowlist]
description = "Reviewed non-secrets"
regexes = [
  # AWS's own published documentation example key.
  '''AKIAIOSFODNN7EXAMPLE''',
  # Structural JWT test vector — the signature segment is the literal
  # "signature_here"; used to test _looks_like_jwt().
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiJ0ZXN0In0\.signature_here''',
]
paths = [
  # Throwaway RSA/Ed25519 keypairs generated solely to exercise paramiko key
  # parsing. They authenticate nothing — no corresponding public key is
  # deployed anywhere. See the note in the file header.
  '''backend/tests/unit/test_paramiko_utils\.py''',
  # PEM headers wrapped around placeholder bodies, not key material:
  #   test_agent_host_candidates.py        -> "MIIEowIBAAKCAQEA000000..."
  #   test_routes_project_secrets.py       -> "fake"
  #   test_infrastructure_access_service.py-> "MIIEowIBAAKCAQEAuTestKeyMaterial"
  '''backend/tests/component/test_agent_host_candidates\.py''',
  '''backend/tests/integration/test_routes_project_secrets\.py''',
  '''backend/tests/unit/test_infrastructure_access_service\.py''',
  # Compiled bytecode of the sources above, which ARE scanned. Not a blanket
  # directory skip of hand-written code, and it buys a clean local run without
  # blinding CI (these are gitignored -- zero tracked files -- so a fresh
  # checkout has none). frontend-v2/dist is deliberately NOT allowlisted: a
  # built JS bundle is where VITE_*-style build-time secret injection lands, so
  # it is the highest-value thing to scan, not to skip (#182 review).
  '''.*__pycache__/.*''',
  '''.*\.pyc$''',
  # gitleaks was never enforced in CI before, so these private-key false
  # positives were never catalogued. All are PEM headers wrapped around a
  # placeholder body -- synthetic keys / "..." / "SECRETCONTENT" in tests, and
  # the textarea hint "-----BEGIN OPENSSH PRIVATE KEY-----\n...\n-----END..."
  # in the key-input UI. Verified 2026-08: no live key material.
  '''backend/tests/component/test_ssh_credential_service\.py''',
  '''backend/tests/component/test_ssh_service\.py''',
  '''backend/tests/integration/test_routes_discovery\.py''',
  '''backend/tests/integration/test_routes_ssh_credentials\.py''',
  '''backend/tests/unit/test_proxy_translate_cis_service\.py''',
  '''backend/tests/unit/test_tmos_engine\.py''',
  '''frontend-v2/src/components/settings/SSHCredentials\.tsx''',
  '''frontend-v2/src/components/settings/__tests__/SSHCredentials\.test\.tsx''',
  '''frontend-v2/src/components/dpu/DpuFormDialog\.tsx''',
  '''frontend-v2/src/components/dpu/RshimInstallDialog\.tsx''',
  '''frontend-v2/src/components/dpu/DpuProjectSettingsCard\.tsx''',
  '''frontend-v2/src/components/discovery/NodeDiscoveryPanel\.tsx''',
]
