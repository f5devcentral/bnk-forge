# BNK-Forge Roadmap — single source of truth
# =================================================================
# Edit this file (or run `bin/roadmap-add.py`) then regenerate with
#   backend/.venv/bin/python bin/roadmap-gen.py
# which (re)writes BOTH docs/ROADMAP.md and docs/roadmap.html.
#
# SCHEMA
# ------
# meta:
#   title:            H1 / page title
#   updated:          date string (shown in header chrome)
#   verified_against: free text (shown in intro)
#   intro_md: |       multi-line markdown rendered verbatim under the MD H1
#   human_view_note:  one-line sub shown under the HTML <h1>
#   stats:            list of {n, label, red?} -> the 4 HTML stat tiles.
#                     Tiles whose n is the literal "AUTO:in_progress" or
#                     "AUTO:planned" are computed from item counts; any other
#                     value (e.g. "25+") is a static meta number.
# status_legend:      key -> { emoji, dot, label } used for BOTH md + html.
#   keys: shipped | in_progress | blocked | deferred | planned
# sections: ordered list of
#   - id:       stable slug (used by roadmap-add.py --section)
#     number:   section number for the md heading "## N. ..."
#     heading:  section title
#     intro:    optional markdown shown under the heading
#     render:   table | cards | bullets
#     html_group: optional HTML super-heading ("In progress" / "Planned" /
#                 "Shipped") used to bucket sections into the 3 HTML grids.
#                 Sections sharing an html_group render their cards together.
#     columns:  (table only) md table header columns
#     raw_md:   optional verbatim markdown body (for prose-only sections that
#               don't map onto items, e.g. the issue index)
#     items:
#       - title:  item title
#         status: a key in status_legend (optional for bullets/raw)
#         refs:   list of strings; "#NNN" / "PR #NNN" become GitHub links
#         note:   free text / "what remains" cell
#         group:  optional; groups items into a named card (cards/table html)
# =================================================================

